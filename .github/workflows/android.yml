name: Android build and release

on:
  push:
    branches: [main, master]
    tags: ["android-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chart-symbols-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    name: Create tagged release
    if: >-
      startsWith(github.ref, 'refs/tags/android-v') ||
      (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
    needs: build
    runs-on: ubuntu-latest
    env:
      BOOTSTRAP_RELEASE_TAG: android-v0.4.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK and AAB
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            RELEASE_TAG="$RELEASE_VERSION"
          else
            RELEASE_TAG="$BOOTSTRAP_RELEASE_TAG"
          fi
          VERSION_NAME="${RELEASE_TAG#android-v}"
          ./gradlew assembleRelease bundleRelease -PversionName="$VERSION_NAME" --stacktrace

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="$BOOTSTRAP_RELEASE_TAG"
          fi
          VERSION_NAME="${RELEASE_TAG#android-v}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; skipping duplicate creation."
          else
            gh release create "$RELEASE_TAG" \
              app/build/outputs/apk/release/app-release.apk \
              app/build/outputs/bundle/release/app-release.aab \
              --generate-notes \
              --title "Chart Symbols $VERSION_NAME"
          fi
